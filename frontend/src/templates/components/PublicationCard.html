<!-- Publication card - used in HomePage -->
<article class="publication-card group flex h-full cursor-pointer flex-col overflow-hidden rounded-2xl border border-border bg-white transition-all duration-300 hover:-translate-y-1 hover:shadow-elevated" data-id="{{id}}">
  <div class="relative aspect-[4/3] overflow-hidden bg-muted">
    <img src="{{image}}" alt="{{title}}" loading="lazy" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" />
    <div class="absolute inset-x-3 top-3 flex items-start justify-between gap-2">
      <span class="rounded-full px-3 py-1 text-[11px] font-semibold uppercase tracking-wide shadow-sm {{statusClass}}">{{statusLabel}}</span>
      <button type="button" class="like-btn flex h-9 w-9 items-center justify-center rounded-full bg-white/95 text-text/50 shadow-sm backdrop-blur transition-all hover:scale-105 hover:text-primary active:scale-95" data-pub-id="{{id}}" aria-pressed="false" aria-label="Save listing: {{title}}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5 transition-transform" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      </button>
    </div>
  </div>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <div class="flex items-start justify-between gap-3">
      <h3 class="line-clamp-2 font-display text-lg font-semibold leading-snug text-text">{{title}}</h3>
      <span class="shrink-0 font-display text-lg font-bold text-primary">{{price}}</span>
    </div>

    <p class="line-clamp-2 text-sm leading-relaxed text-text/60">{{description}}</p>

    <div class="mt-auto flex flex-wrap items-center gap-x-4 gap-y-1.5 border-t border-border/70 pt-3 text-xs text-text/60">
      <span class="inline-flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        {{location}}
      </span>
      <span class="inline-flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        {{date}}
      </span>
    </div>

    <div class="flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-2">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary text-[11px] font-bold text-white">{{initials}}</span>
        <span class="truncate text-sm text-text/70">{{author}}</span>
      </div>
      <button type="button" class="contact-btn inline-flex shrink-0 items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-sm font-semibold text-white transition-all hover:bg-primary-hover active:scale-[0.98]" data-pub-id="{{id}}" data-seller-id="{{userId}}" data-seller-name="{{author}}">
        Contact
      </button>
    </div>
  </div>
</article>
