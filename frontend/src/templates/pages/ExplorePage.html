<div class="flex flex-col gap-2">
  <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-primary">Marketplace</p>
  <h1 class="font-display text-3xl font-bold tracking-tight text-text sm:text-4xl">Explore listings</h1>
  <p class="max-w-2xl text-sm leading-relaxed text-text/60">Search products, services and donations from your community.</p>
</div>

<div class="rounded-2xl border border-border bg-white p-5 shadow-sm">
  <form id="filter-form" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-6">
    <div class="sm:col-span-2 lg:col-span-2">
      <label for="search" class="mb-1.5 block text-sm font-medium text-text">Search</label>
      <input
        type="search"
        id="search"
        name="search"
        placeholder="Title, description..."
        class="w-full rounded-xl border border-border bg-muted/30 px-3.5 py-2.5 text-sm text-text outline-none transition-all duration-200 placeholder:text-text/40 focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/10"
      />
    </div>
    <div>
      <label for="category" class="mb-1.5 block text-sm font-medium text-text">Category</label>
      <select
        id="category"
        name="category"
        class="w-full rounded-xl border border-border bg-muted/30 px-3.5 py-2.5 text-sm text-text outline-none transition-all duration-200 focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/10"
      >
        <option value="">All</option>
      </select>
    </div>
    <div>
      <label for="minPrice" class="mb-1.5 block text-sm font-medium text-text">Min price</label>
      <input
        type="number"
        id="minPrice"
        name="minPrice"
        step="0.01"
        min="0"
        placeholder="0"
        class="w-full rounded-xl border border-border bg-muted/30 px-3.5 py-2.5 text-sm text-text outline-none transition-all duration-200 placeholder:text-text/40 focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/10"
      />
    </div>
    <div>
      <label for="maxPrice" class="mb-1.5 block text-sm font-medium text-text">Max price</label>
      <input
        type="number"
        id="maxPrice"
        name="maxPrice"
        step="0.01"
        min="0"
        placeholder="8"
        class="w-full rounded-xl border border-border bg-muted/30 px-3.5 py-2.5 text-sm text-text outline-none transition-all duration-200 placeholder:text-text/40 focus:border-primary focus:bg-white focus:ring-2 focus:ring-primary/10"
      />
    </div>
    <div class="sm:col-span-2 lg:col-span-1">
      <label class="mb-1.5 block text-sm font-medium text-text">Neighborhood</label>
      <div id="neighborhood-autocomplete"></div>
      <input type="hidden" id="location" name="location" />
    </div>

    <div class="flex flex-col gap-3 border-t border-border/70 pt-4 sm:col-span-2 sm:flex-row sm:justify-end lg:col-span-6">
      <button
        type="button"
        id="clear-filters"
        class="inline-flex items-center justify-center rounded-full border border-border bg-white px-5 py-2.5 text-sm font-medium text-text/70 transition-all duration-200 hover:border-primary/40 hover:text-primary active:scale-[0.98]"
      >
        Clear filters
      </button>
      <button
        type="submit"
        class="inline-flex items-center justify-center gap-2 rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-primary-hover active:scale-[0.98]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></svg>
        Apply filters
      </button>
    </div>
  </form>
</div>

<div id="listings-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 animate-fade-in" style="animation-delay: 100ms"></div>

<div id="pagination" class="mt-8 flex justify-center animate-fade-in" style="animation-delay: 200ms"></div>
