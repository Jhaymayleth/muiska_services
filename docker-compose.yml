services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: muiska-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: muiska
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muiska"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muiska-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: muiska
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: muiska_jwt_secret_dev_2024
      RUN_SEEDS: "true"
      # Solo para el stack local: permite repetir la suite E2E desde la misma
      # IP. En producción se dejan los valores por defecto (10 / 3).
      RATE_LIMIT_AUTH_MAX: "50"
      RATE_LIMIT_REGISTER_MAX: "50"
      # Claves estables para que las suscripciones push sobrevivan reinicios.
      # Si no se definen, el backend las genera en cada arranque (solo dev).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:muiska@localhost}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muiska-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
